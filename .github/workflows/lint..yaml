name: Code quality

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff black mypy bandit vulture types-requests fastapi

      - name: Ruff
        run: ruff check python_codereview.py

      - name: Black
        run: black --check python_codereview.py

      - name: Mypy
        run: mypy python_codereview.py

      - name: Bandit
        run: bandit python_codereview.py

      - name: Vulture
        run: vulture python_codereview.py --min-confidence 80